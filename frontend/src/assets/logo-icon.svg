<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" class="brand-neural-lattice">
  <defs>
    <!-- Premium Chrome Gradient for professional variants -->
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
    
    <!-- Central Core Radial Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Path Glow (used for neon variants) -->
    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Default Monochrome Premium Styles */
    .brand-neural-lattice {
      --primary-color: #FFFFFF;
      --secondary-color: #71717A;
      --tertiary-color: #27272A;
      --core-color: #FFFFFF;
      --line-width: 1.5px;
      --dim-opacity: 0.15;
    }

    /* Rotation & Pulse Keyframes */
    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse-core {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px var(--core-color)); }
    }
    @keyframes pulse-mesh {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.95; }
    }

    /* Target Groups for Animation */
    .animated-orbit-outer {
      transform-origin: 256px 256px;
      animation: spin-clockwise 30s linear infinite;
    }
    .animated-orbit-inner {
      transform-origin: 256px 256px;
      animation: spin-counter 15s linear infinite;
    }
    .animated-lattice {
      transform-origin: 256px 256px;
      animation: pulse-mesh 6s ease-in-out infinite;
    }
    .animated-core {
      transform-origin: 256px 256px;
      animation: pulse-core 3.5s ease-in-out infinite;
    }

    /* Dev Matrix mode overrides when parent container has class */
    :global(.dev-mode-active) .brand-neural-lattice,
    .brand-neural-lattice.dev-mode {
      --primary-color: #39FF14;
      --secondary-color: #15803D;
      --tertiary-color: #14532D;
      --core-color: #39FF14;
      --line-width: 2px;
      --dim-opacity: 0.25;
    }
  </style>

  <!-- BACKGROUND GUIDELINES / BLUEPRINT GRID (Toggled in blueprint view) -->
  <g class="blueprint-lines" opacity="0.3">
    <!-- Center Axes -->
    <line x1="256" y1="32" x2="256" y2="480" stroke="var(--secondary-color)" stroke-width="0.5" stroke-dasharray="4 8" />
    <line x1="32" y1="256" x2="480" y2="256" stroke="var(--secondary-color)" stroke-width="0.5" stroke-dasharray="4 8" />
    
    <!-- Diagonal Precision Axes -->
    <line x1="97" y1="97" x2="415" y2="415" stroke="var(--secondary-color)" stroke-width="0.25" stroke-dasharray="2 10" />
    <line x1="97" y1="415" x2="415" y2="97" stroke="var(--secondary-color)" stroke-width="0.25" stroke-dasharray="2 10" />
    
    <!-- Blueprint Circular Rings -->
    <circle cx="256" cy="256" r="224" stroke="var(--tertiary-color)" stroke-width="0.5" stroke-dasharray="2 8" />
    <circle cx="256" cy="256" r="160" stroke="var(--tertiary-color)" stroke-width="0.5" stroke-dasharray="2 8" />
    <circle cx="256" cy="256" r="96" stroke="var(--tertiary-color)" stroke-width="0.5" stroke-dasharray="2 8" />
  </g>

  <!-- OUTER ARCHITECTURE & INFRASTRUCTURE ORBITS -->
  <g class="infrastructure-orbits">
    <!-- Outer Segmented Ring -->
    <circle class="animated-orbit-outer" cx="256" cy="256" r="224" stroke="var(--primary-color)" stroke-width="var(--line-width)" stroke-dasharray="160 80 40 40 100 40" stroke-linecap="round" />
    
    <!-- Mid Segmented Ring -->
    <circle class="animated-orbit-inner" cx="256" cy="256" r="192" stroke="var(--secondary-color)" stroke-width="1" stroke-dasharray="20 40 80 40" stroke-linecap="round" opacity="0.6" />
    
    <!-- Outer Floating Core Nodes -->
    <g class="animated-orbit-outer">
      <circle cx="256" cy="32" r="3.5" fill="var(--primary-color)" />
      <circle cx="480" cy="256" r="3.5" fill="var(--primary-color)" />
      <circle cx="256" cy="480" r="3.5" fill="var(--primary-color)" />
      <circle cx="32" cy="256" r="3.5" fill="var(--primary-color)" />
    </g>
  </g>

  <!-- INNER NEURAL LATTICE (INTEL) -->
  <g class="animated-lattice">
    <!-- Hexagonal Latent Space Bounds -->
    <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" stroke="var(--primary-color)" stroke-width="var(--line-width)" stroke-linejoin="round" opacity="0.75" />
    
    <!-- Inner Inverted Hexagon -->
    <polygon points="256,160 339,208 339,304 256,352 173,304 173,208" stroke="var(--secondary-color)" stroke-width="1" stroke-linejoin="round" opacity="0.4" />

    <!-- Neural Pathways / Intersecting Node Lines -->
    <!-- Primary Star of David Connections representing latent vector folding -->
    <polygon points="256,96 394,336 118,336" stroke="var(--primary-color)" stroke-width="0.75" opacity="0.35" />
    <polygon points="256,416 394,176 118,176" stroke="var(--primary-color)" stroke-width="0.75" opacity="0.35" />

    <!-- Vector Synapses (Connecting Hex Nodes to center and each other) -->
    <!-- Hexagon Vertices to Center Singularity -->
    <line x1="256" y1="96" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="1" opacity="0.4" />
    <line x1="394" y1="176" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="1" opacity="0.4" />
    <line x1="394" y1="336" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="1" opacity="0.4" />
    <line x1="256" y1="416" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="1" opacity="0.4" />
    <line x1="118" y1="336" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="1" opacity="0.4" />
    <line x1="118" y1="176" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="1" opacity="0.4" />

    <!-- Lattice Nodes (Floating geometric points) -->
    <circle cx="256" cy="96" r="5" fill="var(--primary-color)" stroke="var(--tertiary-color)" stroke-width="2" />
    <circle cx="394" cy="176" r="5" fill="var(--primary-color)" stroke="var(--tertiary-color)" stroke-width="2" />
    <circle cx="394" cy="336" r="5" fill="var(--primary-color)" stroke="var(--tertiary-color)" stroke-width="2" />
    <circle cx="256" cy="416" r="5" fill="var(--primary-color)" stroke="var(--tertiary-color)" stroke-width="2" />
    <circle cx="118" cy="336" r="5" fill="var(--primary-color)" stroke="var(--tertiary-color)" stroke-width="2" />
    <circle cx="118" cy="176" r="5" fill="var(--primary-color)" stroke="var(--tertiary-color)" stroke-width="2" />

    <!-- Sub Nodes for Neural Layer Complexity -->
    <circle cx="256" cy="160" r="3" fill="var(--secondary-color)" />
    <circle cx="339" cy="208" r="3" fill="var(--secondary-color)" />
    <circle cx="339" cy="304" r="3" fill="var(--secondary-color)" />
    <circle cx="256" cy="352" r="3" fill="var(--secondary-color)" />
    <circle cx="173" cy="304" r="3" fill="var(--secondary-color)" />
    <circle cx="173" cy="208" r="3" fill="var(--secondary-color)" />
  </g>

  <!-- CENTRAL SINGULARITY CORE (GLOWING NUCLEUS) -->
  <g class="animated-core">
    <!-- Ambient Radial Glow Layer -->
    <circle cx="256" cy="256" r="44" fill="url(#core-glow)" opacity="0.6" style="mix-blend-mode: screen;" />
    
    <!-- Outer Core Bound -->
    <circle cx="256" cy="256" r="20" stroke="var(--primary-color)" stroke-width="1.5" opacity="0.6" fill="var(--tertiary-color)" />
    
    <!-- Absolute Core Singularity -->
    <circle cx="256" cy="256" r="10" fill="var(--core-color)" />
    
    <!-- Core Laser Guidelines -->
    <line x1="256" y1="230" x2="256" y2="282" stroke="var(--primary-color)" stroke-width="0.5" />
    <line x1="230" y1="256" x2="282" y2="256" stroke="var(--primary-color)" stroke-width="0.5" />
  </g>
</svg>
