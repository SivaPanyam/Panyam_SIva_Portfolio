<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" class="brand-blueprint">
  <style>
    .brand-blueprint {
      --wireframe-color: #71717A;
      --highlight-color: #FFFFFF;
      --bg-blueprint: #000000;
      --laser-color: rgba(255,255,255,0.4);
      --font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .blueprint-text {
      font-family: var(--font-family);
      font-size: 10px;
      fill: var(--wireframe-color);
      letter-spacing: 1px;
    }

    .blueprint-bold {
      fill: var(--highlight-color);
      font-weight: bold;
    }

    .blueprint-line {
      stroke: var(--wireframe-color);
      stroke-width: 0.5px;
    }

    .blueprint-axis {
      stroke: var(--wireframe-color);
      stroke-width: 0.5px;
      stroke-dasharray: 2 6;
    }

    .blueprint-glow {
      stroke: var(--highlight-color);
      stroke-width: 1px;
    }

    /* Dev mode colors */
    :global(.dev-mode-active) .brand-blueprint,
    .brand-blueprint.dev-mode {
      --wireframe-color: #166534;
      --highlight-color: #39FF14;
      --laser-color: rgba(57,255,20,0.5);
    }
  </style>

  <!-- Technical grid backdrop -->
  <g class="grid-backdrop" opacity="0.4">
    <!-- Grid Squares -->
    <path d="M 0,64 L 512,64 M 0,128 L 512,128 M 0,192 L 512,192 M 0,256 L 512,256 M 0,320 L 512,320 M 0,384 L 512,384 M 0,448 L 512,448" stroke="var(--wireframe-color)" stroke-width="0.25" stroke-dasharray="1 9" />
    <path d="M 64,0 L 64,512 M 128,0 L 128,512 M 192,0 L 192,512 M 256,0 L 256,512 M 320,0 L 320,512 M 384,0 L 384,512 M 448,0 L 448,512" stroke="var(--wireframe-color)" stroke-width="0.25" stroke-dasharray="1 9" />
    
    <!-- Outer Blueprint Border Box -->
    <rect x="16" y="16" width="480" height="480" stroke="var(--wireframe-color)" stroke-width="0.5" stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="240" stroke="var(--wireframe-color)" stroke-width="0.25" />
  </g>

  <!-- Dimension indicators -->
  <g class="dimensions" opacity="0.7">
    <!-- Left vertical dimension -->
    <line x1="16" y1="32" x2="16" y2="480" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <path d="M 12,38 L 16,32 L 20,38 M 12,474 L 16,480 L 20,474" stroke="var(--wireframe-color)" stroke-width="0.5" fill="none" />
    <text x="24" y="260" class="blueprint-text" transform="rotate(-90 24 260)">H: 512.00px</text>

    <!-- Top horizontal dimension -->
    <line x1="32" y1="16" x2="480" y2="16" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <path d="M 38,12 L 32,16 L 38,20 M 474,12 L 480,16 L 474,20" stroke="var(--wireframe-color)" stroke-width="0.5" fill="none" />
    <text x="220" y="28" class="blueprint-text">W: 512.00px</text>

    <!-- Angle dimension arc -->
    <path d="M 256,196 A 60,60 0 0,1 308,226" stroke="var(--wireframe-color)" stroke-width="0.5" fill="none" stroke-dasharray="2 2" />
    <text x="296" y="210" class="blueprint-text">θ = 60°</text>
  </g>

  <!-- Technical Annotations -->
  <g class="annotations">
    <!-- Vector coordinates -->
    <text x="32" y="48" class="blueprint-text"><tspan class="blueprint-bold">[NEURAL INFRASTRUCTURE]</tspan></text>
    <text x="32" y="64" class="blueprint-text">MODEL: SYNAPSE-LATTICE-v1.0</text>
    <text x="32" y="80" class="blueprint-text">SCALE: 1.000 (VECTORS RESOLVED)</text>
    
    <text x="330" y="450" class="blueprint-text">ORIGIN: (256, 256)</text>
    <text x="330" y="466" class="blueprint-text">LATENT SPAN: R=224px</text>
    <text x="330" y="482" class="blueprint-text">NODE COUNT: N=12 (STABLE)</text>

    <!-- Node Coordinate labels -->
    <text x="264" y="94" class="blueprint-text">N_0 (256, 96)</text>
    <text x="402" y="174" class="blueprint-text">N_1 (394, 176)</text>
    <text x="402" y="344" class="blueprint-text">N_2 (394, 336)</text>
  </g>

  <!-- Core Blueprint Drafting Structure (Axes + Construction Circles) -->
  <g class="drafting-lines">
    <line x1="256" y1="32" x2="256" y2="480" class="blueprint-axis" />
    <line x1="32" y1="256" x2="480" y2="256" class="blueprint-axis" />

    <circle cx="256" cy="256" r="224" class="blueprint-line" />
    <circle cx="256" cy="256" r="192" class="blueprint-line" stroke-dasharray="2 8" />
    <circle cx="256" cy="256" r="160" class="blueprint-line" stroke-dasharray="4 4" />
    <circle cx="256" cy="256" r="96" class="blueprint-line" stroke-dasharray="1 5" />
  </g>

  <!-- Outer Orbit Segmented Paths (Highlighted with blueprint markers) -->
  <g class="orbits">
    <circle cx="256" cy="256" r="224" stroke="var(--highlight-color)" stroke-width="1" stroke-dasharray="180 80 40 40" />
    <!-- Orbit ticks -->
    <path d="M 256,22 L 256,42 M 460,256 L 490,256 M 256,470 L 256,490 M 22,256 L 52,256" stroke="var(--wireframe-color)" stroke-width="0.5" />
  </g>

  <!-- Hexagonal Lattices & Pathway Vectors -->
  <g class="neural-lattice">
    <!-- Star bounds -->
    <polygon points="256,96 394,336 118,336" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <polygon points="256,416 394,176 118,176" stroke="var(--wireframe-color)" stroke-width="0.5" />

    <!-- Hex bounds (Glow overlay) -->
    <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" stroke="var(--highlight-color)" stroke-width="1.5" />
    
    <!-- Central connections -->
    <line x1="256" y1="96" x2="256" y2="256" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <line x1="394" y1="176" x2="256" y2="256" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <line x1="394" y1="336" x2="256" y2="256" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <line x1="256" y1="416" x2="256" y2="256" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <line x1="118" y1="336" x2="256" y2="256" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <line x1="118" y1="176" x2="256" y2="256" stroke="var(--wireframe-color)" stroke-width="0.5" />

    <!-- Anchor Nodes with drafting points -->
    <g fill="var(--highlight-color)" stroke="var(--wireframe-color)" stroke-width="1">
      <circle cx="256" cy="96" r="4" />
      <circle cx="394" cy="176" r="4" />
      <circle cx="394" cy="336" r="4" />
      <circle cx="256" cy="416" r="4" />
      <circle cx="118" cy="336" r="4" />
      <circle cx="118" cy="176" r="4" />
    </g>

    <!-- Blueprint circles around nodes -->
    <circle cx="256" cy="96" r="10" stroke="var(--wireframe-color)" stroke-width="0.25" stroke-dasharray="2 2" />
    <circle cx="394" cy="176" r="10" stroke="var(--wireframe-color)" stroke-width="0.25" stroke-dasharray="2 2" />
    <circle cx="394" cy="336" r="10" stroke="var(--wireframe-color)" stroke-width="0.25" stroke-dasharray="2 2" />
  </g>

  <!-- Central Core Singularity Drafting -->
  <g class="core">
    <circle cx="256" cy="256" r="28" stroke="var(--highlight-color)" stroke-width="0.5" stroke-dasharray="4 2" />
    <circle cx="256" cy="256" r="16" stroke="var(--wireframe-color)" stroke-width="0.5" />
    <circle cx="256" cy="256" r="4" fill="var(--highlight-color)" />
    
    <!-- Vector alignment ticks -->
    <path d="M 236,256 L 276,256 M 256,236 L 256,276" stroke="var(--highlight-color)" stroke-width="0.5" />
  </g>
</svg>
