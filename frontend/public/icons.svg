<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" class="brand-pwa-icon">
  <style>
    .brand-pwa-icon {
      --primary-color: #FFFFFF;
      --secondary-color: #71717A;
      --tertiary-color: #09090B;
      --core-color: #FFFFFF;
    }
    
    :global(.dev-mode-active) .brand-pwa-icon,
    .brand-pwa-icon.dev-mode {
      --primary-color: #39FF14;
      --secondary-color: #166534;
      --tertiary-color: #022c22;
      --core-color: #39FF14;
    }
  </style>

  <!-- PWA Maskable Solid Safe Zone Container -->
  <rect width="512" height="512" fill="var(--tertiary-color)" />

  <g transform="translate(32, 32) scale(0.875)">
    <!-- Outer Segmented Ring -->
    <circle cx="256" cy="256" r="224" stroke="var(--primary-color)" stroke-width="4.5" stroke-dasharray="160 80 40 40 100 40" stroke-linecap="round" />
    <circle cx="256" cy="256" r="192" stroke="var(--secondary-color)" stroke-width="2" stroke-dasharray="20 40 80 40" stroke-linecap="round" opacity="0.6" />

    <!-- Hexagonal Latent Space Bounds -->
    <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" stroke="var(--primary-color)" stroke-width="4.5" stroke-linejoin="round" opacity="0.75" />
    
    <!-- Vector Synapses -->
    <line x1="256" y1="96" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="2" opacity="0.4" />
    <line x1="394" y1="176" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="2" opacity="0.4" />
    <line x1="394" y1="336" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="2" opacity="0.4" />
    <line x1="256" y1="416" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="2" opacity="0.4" />
    <line x1="118" y1="336" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="2" opacity="0.4" />
    <line x1="118" y1="176" x2="256" y2="256" stroke="var(--secondary-color)" stroke-width="2" opacity="0.4" />

    <polygon points="256,96 394,336 118,336" stroke="var(--primary-color)" stroke-width="1.5" opacity="0.35" />
    <polygon points="256,416 394,176 118,176" stroke="var(--primary-color)" stroke-width="1.5" opacity="0.35" />

    <!-- Joint Nodes -->
    <circle cx="256" cy="96" r="10" fill="var(--primary-color)" />
    <circle cx="394" cy="176" r="10" fill="var(--primary-color)" />
    <circle cx="394" cy="336" r="10" fill="var(--primary-color)" />
    <circle cx="256" cy="416" r="10" fill="var(--primary-color)" />
    <circle cx="118" cy="336" r="10" fill="var(--primary-color)" />
    <circle cx="118" cy="176" r="10" fill="var(--primary-color)" />

    <!-- Singularity Core -->
    <circle cx="256" cy="256" r="30" stroke="var(--primary-color)" stroke-width="3" fill="var(--tertiary-color)" />
    <circle cx="256" cy="256" r="14" fill="var(--core-color)" />
  </g>
</svg>
