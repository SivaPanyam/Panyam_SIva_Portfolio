<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" class="brand-favicon">
  <style>
    .brand-favicon {
      --primary-color: #FFFFFF;
      --secondary-color: #A1A1AA;
      --tertiary-color: #09090B;
    }
    /* Animated spin on hover */
    .brand-favicon:hover .outer-orbit {
      transform-origin: 32px 32px;
      transform: rotate(360deg);
      transition: transform 2s ease-in-out;
    }
    
    :global(.dev-mode-active) .brand-favicon,
    .brand-favicon.dev-mode {
      --primary-color: #39FF14;
      --secondary-color: #166534;
      --tertiary-color: #022c22;
    }
  </style>

  <!-- Solid background for clean app icon rendering -->
  <rect width="64" height="64" rx="14" fill="var(--tertiary-color)" />

  <!-- Outer Orbit Segment -->
  <circle class="outer-orbit" cx="32" cy="32" r="26" stroke="var(--primary-color)" stroke-width="2.5" stroke-dasharray="110 30" stroke-linecap="round" />

  <!-- Inner Hexagon Neural Lattice -->
  <polygon points="32,14 48,23 48,41 32,50 16,41 16,23" stroke="var(--primary-color)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Inverted Core Triangles -->
  <polygon points="32,14 48,41 16,41" stroke="var(--secondary-color)" stroke-width="1" opacity="0.6" />
  <polygon points="32,50 48,23 16,23" stroke="var(--secondary-color)" stroke-width="1" opacity="0.6" />

  <!-- Core Node -->
  <circle cx="32" cy="32" r="6" stroke="var(--primary-color)" stroke-width="1.5" fill="var(--tertiary-color)" />
  <circle cx="32" cy="32" r="3.5" fill="var(--primary-color)" />
</svg>